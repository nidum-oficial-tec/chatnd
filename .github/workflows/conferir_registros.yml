# CONFERIDOR DE REGISTROS. So leitura, gatilho manual + semanal.
#
# Confere se a DOCUMENTACAO e as FIXTURES descrevem o que o codigo, o repositorio e
# a base tem. Nasceu dos catorze registros que descreviam coisas revogadas ou
# apagadas - e dois deles apareceram POR ACASO, no meio de outra tarefa.
#
# JOB VERDE AO ENCONTRAR (rc 2). Relatorio que fica vermelho ao cumprir a funcao
# treina todo mundo a ignorar o vermelho (D30). Vermelho aqui significa uma coisa
# so: o conferidor quebrou.
#
# DUAS CLASSES DEPENDEM DE COISAS QUE ESTE REPO NAO TEM, e o relatorio DIZ quando
# nao as conferiu, em vez de contar como "nada encontrado":
#   - id_fantasma e fixture_vencida precisam do repo da ESTEIRA. Sem o secret
#     ESTEIRA_TOKEN (um PAT com leitura em nidum-chatnd-basefonte) elas ficam de
#     fora.
#   - base_indevida precisa das credenciais da base (OPENWEBUI_*), que hoje moram
#     so no repo da esteira.
# Classe nao conferida contada como limpa e a forma mais silenciosa de um
# conferidor mentir - por isso a ausencia e RELATADA.

name: Conferidor de registros (doc x codigo x repo)

on:
  schedule:
    # Semanal: a defasagem que ele mede acumula em semanas, nao em horas.
    - cron: '40 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a plataforma
        uses: actions/checkout@v4
        with:
          # HISTORICO COMPLETO, e nao o commit do topo. A classe
          # `publicado_divergente` procura o conteudo publicado entre os commits
          # do arquivo para dizer QUAL LADO esta a frente; com o padrao
          # (fetch-depth: 1) ela nao tem onde procurar e a resposta sai como
          # "nao corresponde a nenhum commit" - que se le como "editaram
          # producao". Foi o que aconteceu na primeira rodada.
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir
        id: conf
        env:
          ESTEIRA_TOKEN: ${{ secrets.ESTEIRA_TOKEN }}
          FRAC_CATASTROFE: ${{ vars.FRAC_CATASTROFE }}
          OPENWEBUI_BASE_URL: ${{ secrets.OPENWEBUI_BASE_URL }}
          OPENWEBUI_API_KEY: ${{ secrets.OPENWEBUI_API_KEY }}
        run: |
          # CAMINHO ABSOLUTO, e sem montar o argumento por expansao condicional.
          # A primeira versao usava ${EST:+--esteira "$EST"}: alem do `[ -d ]`
          # relativo, essa expansao passa as ASPAS como caractere literal quando
          # nao vazia, e o script receberia um caminho entre aspas que nao existe.
          # Duas armadilhas de shell numa linha que so escolhia entre dois casos.
          # Agora o caminho e SEMPRE passado, e QUEM DECIDE E O SCRIPT - que ja
          # sabe relatar "nao conferida" quando a pasta nao existe.
          # CLONE EXPLICITO, e nao actions/checkout com continue-on-error. O
          # passo de checkout aparecia como `success` sem trazer nada -
          # continue-on-error mascara o resultado real do passo, e quem contou a
          # verdade foi o `ls`. Passo que se diz bem-sucedido sem ter feito o
          # trabalho e a mesma familia do conferidor que erra sozinho: gasta a
          # confianca de quem le o log.
          EST="$GITHUB_WORKSPACE/_esteira"
          if [ -n "$ESTEIRA_TOKEN" ]; then
            git clone --depth 1 --quiet "https://x-access-token:$ESTEIRA_TOKEN@github.com/nidum-oficial-tec/nidum-chatnd-basefonte.git" "$EST" && echo "esteira clonada" || echo "CLONE FALHOU"
          else
            echo "sem ESTEIRA_TOKEN - duas classes ficam de fora"
          fi
          ls -d "$EST/_scripts" || echo "esteira AUSENTE em $EST"
          set +e
          python _nidum_manutencao/conferir_registros.py \
            --esteira "$EST" --nota "$RUNNER_TEMP/nota.md" \
            2>&1 | tee "$RUNNER_TEMP/saida.txt"
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo '### Conferidor de registros'
            echo ''
            echo '```'
            grep -E '^== |^   consequencia' "$RUNNER_TEMP/saida.txt" || true
            echo '```'
            echo ''
            echo 'A lista completa esta no artefato `nota-registros`, pronta para'
            echo 'virar Nota na plataforma. A importacao e manual, de proposito:'
            echo 'conferidor que escreve na plataforma deixa de ser conferidor.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" != "0" ] && [ "$RC" != "2" ]; then
            echo "::error::conferir_registros.py falhou (rc=$RC)"; exit "$RC"
          fi

      - name: Guardar a Nota
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nota-registros
          path: ${{ runner.temp }}/nota.md
          retention-days: 14
          if-no-files-found: warn
